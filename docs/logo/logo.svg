<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 450" role="img" aria-labelledby="meeet-logo-title">
  <title id="meeet-logo-title">Meeet</title>
  <!--
    세 사람의 가능 시간대(회색 막대)가 겹치는 구간에 앰버 세로 막대가 놓인다.
    원본 PNG(docs/logo/Meeet_logo.png, 1254x1254)를 실측해 좌표를 정규화했다:
    막대 높이 110, 세로 간격 60, 앰버 폭 92. 모두 완전한 알약 형태(rx = 높이/2).
    색은 프로젝트 팔레트에 맞췄다 — gray-200 #e5e7eb, amber-500 #f59e0b.
    겹침색 #dc8f0a는 두 색의 multiply 결과를 미리 계산한 값이다(blend-mode 미사용 —
    파비콘·메일 등 blend를 지원하지 않는 렌더러에서도 동일하게 보이도록).
  -->
  <defs>
    <clipPath id="meeet-logo-band">
      <rect x="345" y="0" width="92" height="450" rx="46" />
    </clipPath>
  </defs>

  <g fill="#e5e7eb">
    <rect x="0" y="0" width="574" height="110" rx="55" />
    <rect x="83" y="170" width="703" height="110" rx="55" />
    <rect x="216" y="340" width="498" height="110" rx="55" />
  </g>

  <rect x="345" y="0" width="92" height="450" rx="46" fill="#f59e0b" />

  <g fill="#dc8f0a" clip-path="url(#meeet-logo-band)">
    <rect x="345" y="0" width="92" height="110" />
    <rect x="345" y="170" width="92" height="110" />
    <rect x="345" y="340" width="92" height="110" />
  </g>
</svg>
